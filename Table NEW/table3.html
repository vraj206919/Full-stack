<!DOCTYPE html>
<html>
<body>

<h3>Using rowspan and colspan</h3>
<table border="1">
  <tr>
    <th rowspan="2">Student</th>
    <th colspan="2">Scores</th>
  </tr>
  <tr>
    <th>Math</th>
    <th>English</th>
  </tr>
  <tr>
    <td>Alex</td>
    <td>85</td>
    <td>78</td>
  </tr>
  <tr>
    <td>Lina</td>
    <td>92</td>
    <td>81</td>
  </tr>
</table>

</body>
</html>
