<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Table Padding</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Name</th>
            <th>Nickname</th>
        </tr>
        <tr>
            <td>Vraj</td>
            <td>Vartej</td>
        </tr>
        <tr>
            <td>Rutik</td>
            <td>Talaja</td>
        </tr>
        <tr>
            <td>Baggo</td>
            <td>Bharatnagar Autostand</td>
        </tr>
    </table>

</body>
</html>
