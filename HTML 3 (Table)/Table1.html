<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 1</title>
</head>

<body>
    <table>
        <tr>
            <th>Person</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Chris</td>
            <td>38</td>
        </tr>
        <tr>
            <td>Dennis</td>
            <td>45</td>
        </tr>
        <tr>
            <td>Sarah</td>
            <td>29</td>
        </tr>
        <tr>
            <td>Karen</td>
            <td>47</td>
        </tr>
    </table>

    <style>
        table {
            border: 2px solid black;
            width: 30%;
            font-family: Arial, sans-serif;
        }

        th,
        td {
            border: 1px solid #999;
            text-align: left;
            padding: 8px;
        }

        th {
            background-color: #000000;
            color: white;
        }
    </style>

</body>
</html>
