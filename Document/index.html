<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table,
        th,
        tr,
        td{
            border: 1px solid grey;
            padding: 20px;
            text-align: center;
            
        }
        table{
            margin-left: 50px;
        }
        .cantainer{
            width: 1000px;
            height: 75  0px;
            border: 2px solid black;
        }
        h2{
            text-align: center;
        }
        .table_row{
            background-color: rgb(129, 129, 129);
        }

        .table_img{
            background-color: rgb(185, 185, 185);
        }
        .product_name{
            background-color: rgb(163, 163, 163);
        }

        .Hurry{
            background-color: bisque;
            text-align: center;
        }
        .Updeted{
            background-color: rgb(165, 160, 160);
            text-align: center;
        }
         th,
         td{
            padding-right: 170px;
         }
    </style>

</head>
<body>

    <div class="cantainer">

        <h2>Top Product for sale </h2>
        
        <table Cellpadding="100px">
            <tr class="table_row">
                <th>Product Image</th>
                <th>Product Name </th>
                <th>Category</th>
                <th>Price</th>
                <th>Availability</th>
            </tr>
            
            <tr class="table_img">
                <td><img src="./iphone.png" height="70px" alt=""></td>
                <td class="product_name">iPhone 15 Pro</td>
                <td>Electronics</td>
                <td>$999</td>
                <td>In Stock</td>
            </tr>
            
            <tr class="table_img">
                <td><img src="./shoes.png" height="70px" alt=""></td>
                <td class="product_name">Nike Running Shoes</td>
                <td>Footwear</td>
                <td>$120</td>
                <td>Limited Stock</td>
            </tr>
            
            <tr class="table_img">
                <td><img src="./leptop.png" height="70px" alt=""></td>
                <td class="product_name">Gaming Laptop</td>
                <td>Electronics</td>
                <td>$1500</td>
                <td>Out of Stock</td>
            </tr>
            
            <tr class="table_img">
                <td><img src="./plain.png" height="70px" alt=""></td>
                <td class="product_name">Leather Handbag</td>
                <td rowspan="2">Fashion</td>
                <td>$85</td>
                <td>In Stock</td>
            </tr>
            
            <tr class="table_img">
                <td><img src="./gogles.png" height="70px" alt=""></td>
                <td class="product_name">Designer Sunglasses</td>
                <td>$250</td>
                <td>Limited Stock</td>
            </tr>
        </table>
    </div>
    </body>
    </html>
