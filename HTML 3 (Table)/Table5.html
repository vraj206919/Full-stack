<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>table 5</title>
  <style>
    table {
      border-collapse: collapse;
      width: 50%;
      margin-top: 30px;
    }
    th, td {
      border: 1px solid black;
      padding: 10px;
      text-align: left;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Month</th>
      <th>Date</th>
    </tr>
    <tr>
      <td>June</td>
      <td>10|06|2025</td>
    </tr>
    <tr>
      <td>July</td>
      <td>15|07|2025</td>
    </tr>
  </table>

</body>
</html>
