<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table 3</title>
    <style>
        table {
            width: 50%;
            margin: 20px 0;
         
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Employee Details</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Vraj</th>
            <th>Rutik</th>
            <th>Baggo</th>
        </tr>
        <tr>
            <td>Age</td>
            <td>17</td>
            <td>18</td>
            <td>18</td>
        </tr>
        <tr>
            <td>Gender</td>
            <td>M</td>
            <td>M</td>
            <td>M</td>
        </tr>
    </table>
</body>
</html>
