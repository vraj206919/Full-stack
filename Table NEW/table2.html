<!DOCTYPE html>
<html>
<body>

<h3>Using rowspan</h3>
<table border="1">
  <tr>
    <th rowspan="2">Name</th>
    <th>Subject</th>
    <th>Marks</th>
  </tr>
  <tr>
    <td>Math</td>
    <td>90</td>
  </tr>
  <tr>
    <td>Sarah</td>
    <td>Science</td>
    <td>88</td>
  </tr>
</table>

</body>
</html>
