<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inline elements</title>
  </head>
  <body>

    <i>this is Italic</i>

    <br />

    <em>this is Italic</em>

    <br />

    <b>this is bold</b>

    <br />

    <strong>this is strong(BOLD)</strong>

    <br />
    <u>this is underline</u>

    <br />

    <mark>this is mark tag</mark>
    <br />
    <del>this is delete</del>

    <br />

    <p>a <sup>2</sup> b <sup>2</sup></p>

    <br />

    <p>h <sub>2</sub>o</p>

    <br />

    <small>this is small letter</small>

    <br />

    <ins>this is insert line</ins>
  </body>
</html>
